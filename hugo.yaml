baseURL: "https://4w4647.github.io/"
title: "4w4647's Blog"
theme: "PaperMod"
enableRobotsTXT: true
canonifyURLs: false

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

# -----------------------------
# CORE SEO + SITE SETTINGS
# -----------------------------
params:
  env: production
  title: "4w4647's Blog"
  description: "Exploit development, reverse engineering, and vulnerability research by Awagat Dhungana (4w4647). x86/x64 assembly, Windows internals, and malware analysis."
  keywords:
    - exploit development
    - reverse engineering
    - vulnerability research
    - binary exploitation
    - x86 assembly
    - x64 assembly
    - Windows internals
    - malware analysis
    - OSED
    - offensive security
  author: "Awagat Dhungana"
  defaultTheme: auto
  disableThemeToggle: false

  # SEO behavior
  ShowFullTextInRSS: true
  ShowCanonicalLink: true
  ShowSchemaOrg: true

  # UI/UX
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowPageNums: true
  ShowRssButtonInSectionTermList: true

  # Open Graph fallback image
  images:
    - /img/avatar.jpeg

  assets:
    favicon: "/favicon.ico"

  # -----------------------------
  # HOMEPAGE PROFILE MODE
  # -----------------------------
  profileMode:
    enabled: true
    title: "Awagat Dhungana (4w4647)"
    subtitle: >
      Security researcher into exploit development, reverse engineering, and vulnerability research.
      C/C++, x86/x64 assembly, Windows internals, and malware analysis.
      Currently preparing for OSED.
    imageUrl: "/img/avatar.jpeg"
    imageWidth: 250
    imageHeight: 250
    imageTitle: "Avatar"

  # -----------------------------
  # SOCIAL SIGNALS (SEO + BRAND)
  # -----------------------------
  socialIcons:
    - name: github
      url: "https://github.com/4w4647/"
    - name: linkedin
      url: "https://linkedin.com/in/4w4647"
    - name: x
      url: "https://x.com/4w4647"

# -----------------------------
# NAVIGATION
# -----------------------------
menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: Categories
      url: /categories/
      weight: 2
    - name: Tags
      url: /tags/
      weight: 3
    - name: Search
      url: /search/
      weight: 4
    - name: About
      url: /about/
      weight: 5

# -----------------------------
# IMPORTANT HUGO BEHAVIOR
# -----------------------------
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false